<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Heart Risk App – Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Giriş</h2>

    <input id="login-username" placeholder="Kullanıcı adı">
    <input id="login-password" type="password" placeholder="Şifre">
    <button onclick="login()">Giriş Yap</button>

    <hr>

    <h2>Kayıt Ol</h2>
    <input id="reg-username" placeholder="Kullanıcı adı">
    <input id="reg-email" placeholder="Email">
    <input id="reg-password" type="password" placeholder="Şifre">
    <button onclick="register()">Kayıt Ol</button>

    <p id="message"></p>
</div>

<script src="script.js"></script>
</body>
</html>
